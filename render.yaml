# Render Blueprint for Nkem Aeronautics: the Express API (server/) and the Next.js site (client/).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. Render reads this file,
# creates both services and asks for every value marked `sync: false` (secrets are entered
# there, never committed). Full steps: docs/DEPLOY-RENDER.md.
#
# The database stays on Neon; paste its pooled connection string into DATABASE_URL.

services:
  - type: web
    name: nkem-api
    runtime: node
    rootDir: server
    region: frankfurt
    plan: starter # free also works, but sleeps after 15 idle minutes (first request then takes ~1 min)
    # db:sync creates/updates the tables; it refuses changes that would drop data, failing the deploy instead.
    buildCommand: npm ci && npx prisma generate && npm run db:sync
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST # the server listens on 127.0.0.1 by default (VPS behind Nginx); Render needs all interfaces
        value: 0.0.0.0
      - key: DATABASE_URL # Neon pooled connection string, keep ?sslmode=require&connect_timeout=15
        sync: false
      - key: DIRECT_URL # Neon direct (non-pooled) connection string, used by prisma db push
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN # main site address used in email links, e.g. https://nkemaeronautics.com
        sync: false
      - key: CORS_ORIGINS # other site addresses, comma-separated, e.g. https://www.nkemaeronautics.com,https://nkem-web.onrender.com
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_USER
        value: nkem@nkemaeronautics.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_PASS
        sync: false
      - key: AWS_ENDPOINT_URL_S3 # Neon object storage (`neon env pull`), for photo and video uploads
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: nkem-aeronautics-bucket
      - key: ADMIN_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY # website assistant (Claude); set this or GEMINI_API_KEY, or neither to show contact options only
        sync: false
      - key: GEMINI_API_KEY # website assistant (Gemini), used when ANTHROPIC_API_KEY is empty
        sync: false

  - type: web
    name: nkem-web
    runtime: node
    rootDir: client
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL # the API address plus /api, e.g. https://nkem-api.onrender.com/api (baked in at build time)
        sync: false
