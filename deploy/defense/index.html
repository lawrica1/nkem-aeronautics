<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nkem Aeronautics Defense</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #07111f;
        color: #f4f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #07111f;
      }

      main {
        width: min(680px, calc(100% - 40px));
        border-left: 4px solid #1689e8;
        padding: 8px 0 8px 28px;
      }

      p {
        margin: 8px 0 0;
        color: #aebfd0;
        line-height: 1.6;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 52px);
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nkem Aeronautics Defense</h1>
      <p>This deployment target is ready for the defense platform team.</p>
    </main>
  </body>
</html>
